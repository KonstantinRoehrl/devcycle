# Not a workflow this repo runs: the five forms of a direct push to the release branch that
# `tests/unit/golden-path.test.mjs` must recognise. A guard that matches only the literal
# `git push origin main` lets every other line here through.
name: pushes-main (fixture)
on: workflow_dispatch
jobs:
  evade:
    runs-on: ubuntu-latest
    steps:
      - run: git push origin main
      - run: git push -u origin main
      - run: git push origin HEAD:main
      - run: git push "$REMOTE" main
      - run: git push --force-with-lease origin refs/heads/main
