name: Validate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    # `dev` is listed so human and merge-API commits landing there get a check suite at push
    # time. It does NOT cover commits pushed with the implicit token — GitHub does not trigger
    # workflows from it — so the release workflows call this one directly via workflow_call.
    branches: [main, dev]
  # Manual re-run, for requesting a suite without inventing a commit.
  workflow_dispatch:
  # Called in-line by the release workflows: the release commit is pushed with the implicit token,
  # and GitHub does not trigger workflows from it, so the push-triggered suite below never fires
  # for the one commit that most needs it. Calling this workflow directly runs the check before
  # the push instead of hoping for one after.
  workflow_call:
    inputs:
      ref:
        # A calling job's own `github.sha`/`github.ref` is fixed at whatever commit the run
        # started on — it does not follow a commit a prior job in the same run pushes later.
        # Callers that create a new commit mid-run (prepare-release.yml) pass its sha here so
        # the checkout below validates THAT commit; every other trigger leaves this empty and
        # falls back to the normal default.
        description: 'Commit to validate — defaults to github.ref when omitted'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # inputs.ref is empty/falsy on every trigger except workflow_call callers that pass
          # one explicitly, so this falls back to the normal default (push, pull_request,
          # workflow_dispatch, manual re-run) unchanged.
          ref: ${{ inputs.ref || github.ref }}
          # Full history: the secret scan below reads every commit, not just the tip. A secret
          # committed and removed one commit later stays fetchable, so scanning the tip alone
          # reports green on a repository that is still leaking.
          fetch-depth: 0
          # Nothing in this job writes to the repository, so the checkout credential has no
          # reason to stay in .git/config where any later step could reach it.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Validate manifests, playbooks, budget, fences
        run: node scripts/validate.mjs
      - name: Redaction guard (host paths, session ids, deny-listed terms)
        run: node scripts/redaction-check.mjs
      - name: Check for duplicated prose across the runtime surface
        run: node scripts/duplication-check.mjs
      - name: Workflow script tests (stubbed CLIs — no model call, no API key)
        run: node --test tests/unit/*.test.mjs
      - name: Secret scan — full history
        env:
          # Pinned by version AND digest: a release asset is mutable, a checksum is not.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
  plugin-load:
    name: Plugin loads under Claude Code's real validator
    # scripts/validate.mjs is a HOMEGROWN approximation of the plugin loader — it only rejects
    # the loader-failure classes we thought to encode. A userConfig `"type": "integer"` slipped
    # past it in 0.17.0 and the plugin failed to load on update. This job runs Claude Code's
    # ACTUAL validator against the manifest, so a manifest the real loader would reject fails CI
    # here instead of after a release ships. It gates all three surfaces at once: every PR, the
    # pre-merge check `Prepare release` calls (prepare-release.yml -> validate), and the
    # pre-publish check `Release` calls (bump-version.yml -> validate) — both `uses:` this
    # workflow, and a reusable-workflow call is green only if all its jobs are.
    # The validator needs no ANTHROPIC_API_KEY, no network, and no model call.
    # Pin maintenance: bump CLAUDE_CLI_VERSION by hand (there is no package.json for Dependabot
    # to track a global CLI). A bump to a version that adds a new validator warning reddens this
    # job first under --strict — which is the intended early-warning, not a regression.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLAUDE_CLI_VERSION: 2.1.258
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same ref as the `validate` job: workflow_call callers (prepare-release.yml) pass the
          # bumped sha in inputs.ref, so this validates THAT commit's manifest, not the run's
          # pre-bump github.sha. Every other trigger leaves inputs.ref empty and falls back to
          # github.ref. Shallow checkout (default depth) is enough — this reads the manifest, not
          # git history.
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Install the pinned Claude Code CLI
        # Exact-version pin (never @latest) for reproducible CI; npm supplies the registry
        # integrity for the pin. The package runs a postinstall that fetches platform binaries,
        # so --ignore-scripts is not usable.
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
      - name: Validate the plugin against the real loader
        # --strict fails on warnings too. CI=true + stdin from /dev/null keep it non-interactive
        # so a first-run prompt can never block the runner.
        env:
          CI: "true"
        run: claude plugin validate . --strict < /dev/null
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: PR title must be a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -qE '^(feat|fix|perf|docs|chore|ci|refactor|style|test|build)(\([a-z0-9-]+\))?!?: .+' || {
            echo "PR title '$TITLE' is not a Conventional Commit."
            echo "The squash-merge subject drives the release version bump; a malformed title ships no release."
            exit 1
          }
  commit-convention:
    name: Commit subjects are Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit subject on this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while IFS= read -r subject; do
            case "$subject" in
              Merge\ *) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq '^(feat|fix|perf|docs|chore|ci|refactor|style|test|build)(\([a-z0-9./-]+\))?!?: .+'; then
              echo "::error::not a Conventional Commit: $subject"
              fail=1
            fi
          done < <(git log --format=%s "$BASE_SHA".."$HEAD_SHA")
          exit "$fail"
