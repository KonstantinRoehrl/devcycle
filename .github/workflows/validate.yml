name: Validate
on:
  pull_request:
  push:
    # `dev` is listed so every commit that lands there gets a check suite at push time,
    # including the ones GitHub's merge API creates on squash-merge. Without it nothing
    # subscribes to `dev`, its tip carries no suite, and a `dev` -> `main` release PR
    # opened on that tip reports mergeable with zero checks — silently unverified.
    branches: [main, dev]
  # Manual re-run, for requesting a suite without inventing a commit.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate manifests, skills, budget, fences
        run: node scripts/validate.mjs
      - name: Redaction guard
        run: node scripts/redaction-check.mjs
      - name: Duplication check
        run: node scripts/duplication-check.mjs
      - name: Workflow script tests (stubbed CLIs — no model call, no API key)
        run: node --test tests/unit/*.test.mjs
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title must be a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -qE '^(feat|fix|perf|docs|chore|ci|refactor|style|test|build)(\([a-z0-9-]+\))?!?: .+' || {
            echo "PR title '$TITLE' is not a Conventional Commit."
            echo "The squash-merge subject drives the release version bump; a malformed title ships no release."
            exit 1
          }
