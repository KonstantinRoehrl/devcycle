name: Release
# Tags and publishes whatever version main already carries. The bump itself arrives through
# the release PR (see `Prepare release`), so this workflow never writes to main — which is
# what lets a ruleset require every change there to come through a checked pull request.
# Blast radius: this workflow tags the repository and publishes a release. It is the only
# workflow with write access to tags and releases. A failure here can publish a version that
# no Validate run gated; a successful run is immutable and cannot be retracted, only
# superseded. Gated on: the Release job's `needs:` dependency on Validate (added in #41).
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # Reading this commit's own check history is what the gate below is made of.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — same pin as validate.yml
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a green Validate run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Tag-and-publish is the last gate before a version is public, and until now it had
          # none of its own: its only question was whether the tag already existed. A commit
          # that reaches main outside a checked pull request — an admin bypass, a weakened
          # ruleset — would be tagged and published unverified. So wait for this commit's own
          # Validate run instead of trusting that one happened.
          for _ in $(seq 1 40); do
            conclusion=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"')
            case "$conclusion" in
              success) echo "Validate succeeded for $SHA."; exit 0 ;;
              pending) sleep 15 ;;
              *) echo "Validate concluded '$conclusion' for $SHA — refusing to publish."; exit 1 ;;
            esac
          done
          echo "Validate did not conclude for $SHA within 10 minutes — refusing to publish."
          exit 1

      - name: Read the version main carries
        id: v
        run: echo "version=$(node -p "require('./.claude-plugin/plugin.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          V: ${{ steps.v.outputs.version }}
        run: |
          # Every push to main runs this, but only a release PR changes the version — so an
          # unchanged version means this push was not a release and there is nothing to do.
          if git rev-parse -q --verify "refs/tags/devcycle--v$V" >/dev/null; then
            echo "tag devcycle--v$V already exists — nothing to release"
            exit 0
          fi
          # Fails loudly on an empty section rather than publishing a release body that says
          # nothing about what shipped.
          node scripts/bump-version.mjs --notes-for "$V" > .release-notes.md
          git tag "devcycle--v$V"
          # persist-credentials: false above means the checkout left no push credential in
          # .git/config, so authenticate the push explicitly right before it.
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          git push origin "devcycle--v$V"
          gh release create "devcycle--v$V" --title "devcycle v$V" --notes-file .release-notes.md
