name: Prepare release
# Stages a release on dev: bumps the version, writes the CHANGELOG entry, and opens the
# dev -> main PR. The bump travels in that PR because nothing may push straight to main.
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Release PR title — a Conventional Commit; its type sets the version bump (feat -> minor, fix -> patch, ! -> major)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@00cda2d0920b135ce8d7e1a1d3ca379b1a19c1e7 # v4.0.0
        with:
          node-version: lts/*

      - name: Refuse to prepare a release from anything but dev
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The dispatch ref is chooseable in the UI; the checkout above pins dev, so a run
          # started elsewhere would silently stage the wrong tree without this.
          if [ "$REF_NAME" != "dev" ]; then
            echo "Run this workflow from dev — got '$REF_NAME'."
            exit 1
          fi

      - name: Bump version and changelog
        id: bump
        env:
          TITLE: ${{ inputs.title }}
        run: echo "version=$(node scripts/bump-version.mjs --subject "$TITLE")" >> "$GITHUB_OUTPUT"

      - name: Check whether the bump already landed
        id: guard
        run: |
          set -euo pipefail
          COMMITTED=$(git log -1 --format=%s -- .claude-plugin/plugin.json | grep -oP '(?<=prepare v)\S+' || echo "")
          CURRENT=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$COMMITTED" = "$CURRENT" ] && git log -1 --format=%s | grep -q "^chore(release): prepare v$CURRENT$"; then
            echo "already-bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "already-bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the version bump
        if: steps.guard.outputs.already-bumped != 'true'
        env:
          V: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json CHANGELOG.md
          git commit -m "chore(release): prepare v$V"

      - name: Push the bump to dev
        if: steps.guard.outputs.already-bumped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # persist-credentials: false above means the checkout left no push credential in
          # .git/config, so authenticate the push explicitly right before it.
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          n=0
          until git push origin dev; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "push to dev failed after $n rebase retries"
              exit 1
            fi
            git pull --rebase origin dev
          done

      - name: Validate the release commit
        uses: ./.github/workflows/validate.yml

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          V: ${{ steps.guard.outputs.already-bumped == 'true' && steps.guard.outputs.version || steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          if gh pr list --base main --head dev --state open --json number \
               --jq 'length' | grep -qv '^0$'; then
            echo "Release PR already open."; exit 0
          fi
          if ! gh pr create --base main --head dev --title "$TITLE" \
                 --body "Release **v$V**, staged by \`Prepare release\`.

          \`.claude-plugin/plugin.json\` and \`CHANGELOG.md\` are already bumped in this PR, so
          merging it needs no push to \`main\`. On merge, \`Release\` tags \`devcycle--v$V\` and
          publishes the GitHub release from the CHANGELOG section.

          Squash-merge with this exact title — it becomes main's commit subject."; then
            echo "::error::Could not create the release PR. Enable it in the repository settings:"
            echo "::error::Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests"
            echo "::error::The version bump is committed and pushed to dev; re-run this workflow after enabling it."
            exit 1
          fi
